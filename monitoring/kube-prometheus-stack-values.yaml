# Values for the EXISTING `monitoring` release of kube-prometheus-stack.
#
# This is custom_kube_prometheus_stack.yml from ~/observability-zero-to-hero/day-2
# with storage added — nothing that was already there has been changed or removed.
# It lives in the repo so the CI rsync carries it to the bastion and the cluster's
# configuration stops living in a tutorial checkout in someone's home directory.
#
# Apply:
#   helm upgrade --install monitoring prometheus-community/kube-prometheus-stack \
#     --namespace monitoring \
#     -f ~/deployments/monitoring/kube-prometheus-stack-values.yaml
#
# Check your installed chart version first (`helm list -n monitoring`) and pass
# the same --version, or the upgrade silently moves you to the newest chart.

grafana:
  adminPassword: prom-operator

  # WITHOUT THIS, every dashboard edit, user, API key, preference and starred
  # dashboard is lost on pod restart — Grafana's state lives in a SQLite file
  # inside the container. Dashboards provisioned from ConfigMaps (the Traefik
  # one in monitoring/dashboards/) survive regardless; anything created in the
  # UI does not.
  persistence:
    enabled: true
    type: pvc
    storageClassName: csi-cinder-sc-delete
    accessModes:
      - ReadWriteOnce
    size: 5Gi

  # REQUIRED once persistence is on. The PVC is ReadWriteOnce, so a rolling
  # update deadlocks the moment the new pod lands on a different node: the old
  # pod still holds the volume, the new one waits forever on Multi-Attach, and
  # the rollout never finishes. Recreate takes Grafana down for ~30s per upgrade
  # instead, which is the correct trade for a single-replica dashboard server.
  deploymentStrategy:
    type: Recreate

alertmanager:
  alertmanagerSpec:
    # Selects Alertmanager configuration based on these labels. Ensure that the Alertmanager configuration has matching labels.
    # ✅ Solves error: Misconfigured Alertmanager selectors can lead to missing alert configurations.
    # ✅ Solves error: Alertmanager wasn't able to findout the applied CRD (kind: Alertmanagerconfig)
    alertmanagerConfigSelector:
      matchLabels:
        release: monitoring

    # Sets the number of Alertmanager replicas to 3 for high availability.
    # ✅ Solves error: Single replica can cause alerting issues during pod failures.
    # ✅ Solves error: Alertmanager Cluster Status is Disabled (GitHub issue)
    replicas: 2

    # Sets the strategy for matching Alertmanager configurations. 'None' means no specific matching strategy.
    # ✅ Solves error: Incorrect matcher strategy can lead to unhandled alert configurations.
    # ✅ Solves error: Get rid of namespace matchers when creating AlertManagerConfig (GitHub issue)
    alertmanagerConfigMatcherStrategy:
      type: None

    # Silences are stored on disk. On emptyDir, every silence you create
    # disappears when the pod moves — so a muted alert starts paging again at
    # the worst possible moment, mid-maintenance. One PVC per replica (2 here).
    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: csi-cinder-sc-delete
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi

prometheus:
  prometheusSpec:
    # How far back you can look. This is also what decides whether you can
    # answer "was this happening last week too?" during an incident.
    retention: 15d

    # A second, independent ceiling: Prometheus starts dropping the oldest
    # blocks at this size regardless of the time window. Set below the PVC size
    # because compaction needs working room — a full Prometheus disk wedges the
    # TSDB and needs manual recovery, and it happens at 03:00, not at noon.
    retentionSize: 16GiB

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: csi-cinder-sc-delete
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 20Gi

# NOT SET ON PURPOSE: serviceMonitorSelectorNilUsesHelmValues and
# ruleSelectorNilUsesHelmValues. Leaving them at their defaults means Prometheus
# adopts only objects labelled `release: monitoring`, which everything in
# monitoring/ already carries. Flipping them to false would widen adoption to
# every ServiceMonitor in the cluster — a behaviour change, not a cleanup.
