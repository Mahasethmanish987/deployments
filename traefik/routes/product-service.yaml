apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: product-service
spec:
  entryPoints:
    - websecure

  routes:
    # The API serves four top-level resources, so the gateway matches each one
    # and forwards the path untouched - the service really does answer on
    # /products, /categories, /orders and /stats.
    # /health, /ready, /version and /docs stay unrouted: the probes reach them
    # inside the cluster.
    - match: >-
        Host(`foodonline.run.place`) &&
        ( PathPrefix(`/products`)
        || PathPrefix(`/categories`)
        || PathPrefix(`/orders`)
        || PathPrefix(`/stats`) )
      kind: Rule

      middlewares:
        - name: cors
          namespace: traefik
        - name: rate-limit
          namespace: traefik

      services:
        - name: product-service
          port: 8000

  tls:
    secretName: foodonline-tls
