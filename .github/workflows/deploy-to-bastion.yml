name: Deploy deployments to Bastion

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.BASTION_SSH_KEY }}" > ~/.ssh/github-actions-bastion
          chmod 600 ~/.ssh/github-actions-bastion

          ssh-keyscan -H "${{ secrets.BASTION_HOST }}" >> ~/.ssh/known_hosts

      - name: Test SSH connection
        run: |
          ssh \
            -i ~/.ssh/github-actions-bastion \
            -o IdentitiesOnly=yes \
            "${{ secrets.BASTION_USER }}@${{ secrets.BASTION_HOST }}" \
            "echo SSH connection successful"

      - name: Sync repository to Bastion
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/github-actions-bastion -o IdentitiesOnly=yes" \
            --exclude='.git/' \
            --exclude='.github/' \
            ./ \
            "${{ secrets.BASTION_USER }}@${{ secrets.BASTION_HOST }}:~/deployments/"