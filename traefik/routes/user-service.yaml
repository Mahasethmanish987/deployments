apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: user-service
spec:
  entryPoints:
    - websecure

  routes:
    - match: Host(`foodonline.run.place`) && PathPrefix(`/users`)
      kind: Rule

      middlewares:
        - name: cors
          namespace: traefik
        - name: rate-limit
          namespace: traefik

      services:
        - name: user-service
          port: 8000

  tls:
    secretName: foodonline-tls
