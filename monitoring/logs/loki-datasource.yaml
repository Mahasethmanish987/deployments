# Registers Loki as a Grafana datasource WITHOUT a helm upgrade of the
# monitoring release.
#
# kube-prometheus-stack runs a sidecar next to Grafana that watches the release
# namespace for ConfigMaps labelled `grafana_datasource: "1"` and writes their
# contents into Grafana's provisioning directory. Adding the datasource here
# means custom_kube_prometheus_stack.yml stays untouched.
#
# The fixed `uid: loki` is what the dashboard's datasource variable binds to.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: monitoring
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        isDefault: false
        jsonData:
          maxLines: 1000
