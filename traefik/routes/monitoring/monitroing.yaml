apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: product-service
spec:
  entryPoints:
    - websecure

  routes:
    - match: Host(`foodonline.run.place`) && PathPrefix(`/grafana`)
      kind: Rule

      middlewares:
        - name: redirect-to-https 
          namespace: traefik

      services:
        - name: monitoring-grafana
          port: 80

  tls:
    secretName: foodonline-tls
