# Makes Traefik's 5xx counters visible to the existing kube-prometheus-stack.
#
# Traefik serves Prometheus metrics on :9100 (install.sh already sets
# metrics.prometheus.enabled=true), but the Helm-managed LoadBalancer Service
# only publishes 80/443 — nothing can reach 9100. This adds a ClusterIP Service
# for that port plus the ServiceMonitor that tells the operator to scrape it.
#
# Apply AFTER traefik/install.sh (it creates the traefik namespace).
---
apiVersion: v1
kind: Service
metadata:
  name: traefik-metrics
  namespace: traefik
  labels:
    app.kubernetes.io/name: traefik
    app.kubernetes.io/component: metrics
spec:
  type: ClusterIP
  selector:
    # The Traefik chart sets instance to "<release>-<namespace>" — with
    # `helm upgrade --install traefik ... --namespace traefik` that is
    # "traefik-traefik". Verify before trusting it:
    #   kubectl get pods -n traefik --show-labels
    app.kubernetes.io/instance: traefik-traefik
    app.kubernetes.io/name: traefik
  ports:
    - name: metrics
      port: 9100
      targetPort: 9100
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: traefik
  namespace: traefik
  labels:
    # REQUIRED. custom_kube_prometheus_stack.yml does not set
    # serviceMonitorSelectorNilUsesHelmValues: false, so Prometheus only adopts
    # ServiceMonitors carrying `release: <helm release name>`. Your release is
    # "monitoring". Drop this label and the scrape silently never happens.
    release: monitoring
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: metrics
  namespaceSelector:
    matchNames:
      - traefik
  endpoints:
    - port: metrics
      path: /metrics
      interval: 30s
      # Traefik's metrics carry their own `service` label holding the backend
      # name (e.g. default-product-service-8000@kubernetescrd). Kubernetes SD
      # overwrites it with the scraped Service's name ("traefik-metrics") and
      # moves the original to `exported_service`. These two rules put it back,
      # which is what makes per-backend 5xx alerting possible at all.
      metricRelabelings:
        - sourceLabels: [exported_service]
          targetLabel: service
        - action: labeldrop
          regex: exported_service
