# Loki — SingleBinary, filesystem storage. Chart: grafana/loki 7.3.0
#
# Sized for ingress logs on a small cluster, not for a log platform. Everything
# optional in the chart is turned off: the memcached caches alone request ~10Gi
# of RAM at chart defaults, which will not schedule here and buys nothing at
# this volume.
#
# SKIP THIS FILE ENTIRELY if you already run Loki — just point
# promtail-values.yaml at your existing Loki push URL.

deploymentMode: SingleBinary

loki:
  # No multi-tenancy: a single X-Scope-OrgID would otherwise be required on
  # every read and write.
  auth_enabled: false

  commonConfig:
    replication_factor: 1

  storage:
    type: filesystem
    filesystem:
      chunks_directory: /var/loki/chunks
      rules_directory: /var/loki/rules

  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h

  limits_config:
    # Ingress access logs are high-volume and low-value after a week. Raise only
    # if you need to answer "what happened last month" from logs rather than
    # from the 5xx metrics, which Prometheus keeps independently.
    retention_period: 168h        # 7 days
    # Traefik access logs are one line per request — the chart default of
    # 4 MB/s per tenant is generous, but a traffic spike plus a retry storm can
    # hit it and silently drop lines. 8 MB/s with a matching burst.
    ingestion_rate_mb: 8
    ingestion_burst_size_mb: 16

  compactor:
    retention_enabled: true
    retention_delete_delay: 2h
    delete_request_store: filesystem
    working_directory: /var/loki/retention

singleBinary:
  replicas: 1
  persistence:
    enabled: true
    size: 20Gi
    # MUST be set explicitly — this cluster has three StorageClasses and none of
    # them is marked default, so an unset storageClass produces a PVC with no
    # provisioner that stays Pending forever (hit 2026-09-17 on first install).
    #
    # Why this one of the three:
    #   csi-cinder-sc-delete  allowVolumeExpansion=true, reclaim Delete  <- here
    #   csi-cinder-sc-retain  expansion too, but Retain leaves orphaned Cinder
    #                         volumes behind on uninstall
    #   cinder                WaitForFirstConsumer, allowVolumeExpansion=FALSE
    #
    # Expansion is the deciding factor: log volume only grows, and expansion
    # cannot be added to a PVC after it is created — you would have to delete
    # the PVC and lose the data.
    #
    # Caveat: this class binds Immediate, so the volume is provisioned before
    # the pod is scheduled. On a cluster spanning availability zones that can
    # land the volume in a zone the pod cannot reach; if that happens, switch to
    # `cinder` (WaitForFirstConsumer) and accept the loss of expansion.
    storageClass: cinder

# ── Everything below is chart scaffolding we do not want ──────────────────
# gateway is an nginx front door needed only for the microservices modes.
gateway:
  enabled: false

# Scaled-out roles — must be 0 in SingleBinary mode.
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0

# memcached tiers: large memory requests, no benefit at this scale.
chunksCache:
  enabled: false
resultsCache:
  enabled: false

# Synthetic log generator + helm test pod.
lokiCanary:
  enabled: false
test:
  enabled: false

minio:
  enabled: false
