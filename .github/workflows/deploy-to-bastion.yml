name: Deploy deployments to Bastion

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    name: Sync to Bastion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup SSH
        shell: bash
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          echo "${{ secrets.BASTION_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519

          ssh-keyscan -H "${{ secrets.BASTION_HOST }}" >> ~/.ssh/known_hosts

      - name: Sync repository to Bastion
        run: |
          rsync -avz --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            ./ \
            "${{ secrets.BASTION_USER }}@${{ secrets.BASTION_HOST }}:~/deployments/"